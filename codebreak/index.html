<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#0b1130">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="../icons/favicon.png"><title>코드 추리</title></head>
<body>
<style>
body{background:radial-gradient(circle at 50% 0%,#1d3a6e 0,#0b1430 55%,#050914 100%)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#5ab0ff10 1px,transparent 1px),linear-gradient(90deg,#5ab0ff10 1px,transparent 1px);background-size:32px 32px;animation:grid 12s linear infinite;mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 80%)}
@keyframes grid{to{background-position:32px 32px}}
.tl{width:46px;height:64px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font:900 26px/1 ui-rounded,system-ui,sans-serif;position:relative;border:0;transform-style:preserve-3d;transition:transform .18s}
.tl.k{background:linear-gradient(160deg,#3a3a4a,#111118 60%,#000);color:#fff;box-shadow:inset 0 2px 0 #ffffff30,inset 0 -4px 0 #0008,0 4px 0 #000,0 6px 12px #000a}
.tl.w{background:linear-gradient(160deg,#fff,#e6e8ef 60%,#c4c8d4);color:#1b1f2b;box-shadow:inset 0 2px 0 #fff,inset 0 -4px 0 #0002,0 4px 0 #8a8fa0,0 6px 12px #000a}
.tl.h:not(.mine){font-size:22px;color:transparent}
.tl.h:not(.mine)::before{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#5ab0ff;text-shadow:0 0 10px #5ab0ff}
.tl.w.h:not(.mine)::before{color:#2a6bd6;text-shadow:none}
.tl.up{box-shadow:0 0 0 3px #ffd24d,0 0 16px #ffd24dcc,0 4px 10px #000a}
.tl.up::after{content:"";position:absolute;inset:0;border-radius:9px;background:linear-gradient(115deg,transparent 35%,#ffffff55 50%,transparent 65%);background-size:250% 100%;animation:shine 2.6s infinite}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.tl.mine{outline:2px dashed #5ab0ff;outline-offset:2px}
.tl.mine.up{outline:0}
.tl.pick{transform:translateY(-12px) scale(1.12);box-shadow:0 0 0 3px #6cf,0 0 26px #6cf,0 14px 18px #000a !important;z-index:3}
.tl.tg{cursor:pointer;animation:tgl 1s infinite alternate}
.tl.tg:hover{transform:translateY(-6px)}
@keyframes tgl{from{filter:brightness(1)}to{filter:brightness(1.35) drop-shadow(0 0 8px #5ab0ff)}}
.tl.nw::after{content:"NEW";position:absolute;top:-9px;right:-8px;background:#e0453a;color:#fff;font:800 9px system-ui;padding:2px 5px;border-radius:6px;box-shadow:0 2px 6px #000a;animation:none}
.nums{display:grid;grid-template-columns:repeat(6,48px);gap:7px;justify-content:center;padding:10px;border-radius:16px;background:#00000055;box-shadow:inset 0 0 0 1px #5ab0ff44,0 0 24px #5ab0ff33;animation:kpIn .25s cubic-bezier(.2,1.5,.4,1)}
@keyframes kpIn{from{transform:scale(.7) translateY(20px);opacity:0}}
.nums button{width:48px;height:56px;padding:0;font:900 22px ui-rounded,system-ui,sans-serif;border-radius:9px;transition:transform .1s}
.nums.k button{background:linear-gradient(160deg,#3a3a4a,#111118);color:#fff;box-shadow:inset 0 2px 0 #ffffff30,0 3px 0 #000}
.nums.w button{background:linear-gradient(160deg,#fff,#d8dbe4);color:#1b1f2b;box-shadow:inset 0 2px 0 #fff,0 3px 0 #8a8fa0}
.nums button:not(:disabled):hover{transform:translateY(-3px) scale(1.06)}
.nums button:disabled{opacity:.15}
.combo{font:900 20px system-ui;color:#ffd24d;text-shadow:0 0 12px #ff9f1c;animation:cmb .6s ease-in-out infinite alternate}
@keyframes cmb{to{transform:scale(1.12)}}
.row[data-p] .tl{margin:0 1px}
</style><script src="../fx.js"></script>
<script src="../cardkit.js"></script><script src="../firebase-config.js"></script><script src="../net.js"></script>
<script>
const {rnd,shuf}=CK;
const CIDK=1+(Math.random()*9973|0),cid=id=>"t"+((id+1)*CIDK%100003);
const key=id=>(id%12)*2+(id<12?0:1),col=id=>id<12?0:1,num=id=>id%12;
const alive=(S,p)=>S.rows[p].some(t=>!t.up);
function insert(S,p,id,isNew){const row=S.rows[p];let i=row.findIndex(t=>key(t.id)>key(id));if(i<0)i=row.length;row.splice(i,0,{id,up:false,nw:!!isNew})}
function startTurn(S,p){
  S.cur=p;S.chain=0;S.rows.forEach(r=>r.forEach(t=>t.nw=false));
  if(S.pool.length){S.drawn=S.pool.pop();insert(S,p,S.drawn,true)}else S.drawn=-1;
}
function nextAlive(S,p){for(let k=1;k<=S.np;k++){const q=(p+k)%S.np;if(alive(S,q))return q}return p}
function endTurn(S){startTurn(S,nextAlive(S,S.cur))}
function checkWin(S){const a=[...Array(S.np).keys()].filter(p=>alive(S,p));if(a.length<=1){S.over=true;S.win=a.length?a[0]:S.cur;return true}return false}
// 플레이어 p가 알고 있는 타일 id 집합
function known(S,p){const k=new Set();S.rows[p].forEach(t=>k.add(t.id));S.rows.forEach(r=>r.forEach(t=>{if(t.up)k.add(t.id)}));return k}
// 상대 줄 tp의 ti번째 타일이 될 수 있는 숫자 후보
function cands(S,p,tp,ti){
  const row=S.rows[tp],t=row[ti],kn=known(S,p);
  let lo=-1,hi=99;
  for(let i=ti-1;i>=0;i--)if(row[i].up){lo=key(row[i].id);break}
  for(let i=ti+1;i<row.length;i++)if(row[i].up){hi=key(row[i].id);break}
  const out=[];
  for(let n=0;n<12;n++){const id=col(t.id)*12+n;if(kn.has(id))continue;const k=key(id);if(k>lo&&k<hi)out.push(n)}
  return out;
}
// ── 연출 ──
function fxAfter(S,a,me,names,T){
  if(!window.FX)return;
  const L=S.last;if(!L)return;
  const tileAt=(p,i)=>{const r=T.querySelector(`.row[data-p="${p}"]`);return r&&r.children[i]};
  if(a.t==="stop"){FX.sfx("tap");return}
  if(a.t!=="guess")return;
  const el=tileAt(L.tp,L.ti);if(!el)return;
  const fg=getComputedStyle(el).color;
  // 1) 두근두근: 흔들리며 숫자 가리기
  FX.sfx("drum",{n:5});
  el.animate([{transform:"none",color:"transparent"},{transform:"translateY(-10px) rotate(-6deg) scale(1.15)",color:"transparent",offset:.15},{transform:"translateY(-10px) rotate(6deg) scale(1.15)",color:"transparent",offset:.3},{transform:"translateY(-10px) rotate(-6deg) scale(1.15)",color:"transparent",offset:.45},{transform:"translateY(-10px) rotateY(90deg) scale(1.2)",color:"transparent",offset:.62},{transform:"translateY(-6px) rotateY(0) scale(1.25)",color:fg,offset:.8},{transform:"none",color:fg}],{duration:1050,easing:"ease-in-out"});
  const sh=document.createElement("div");
  setTimeout(()=>{
    const c=FX.center(el);
    if(L.t==="ok"){
      FX.sfx("ok",{combo:L.chain});FX.sfx("flip");
      FX.burst(c.x,c.y,{n:28+L.chain*8,color:["#ffd24d","#fff","#5ee08a"],speed:6+L.chain,g:.1,size:5,life:50,shape:"star"});FX.ring(c.x,c.y,"#ffd24d",{r0:20,grow:3});
      FX.float(c.x,c.y-30,"정답! "+L.n,"#5ee08a");
      if(L.chain>=2)FX.banner(`🔥 연속 x${L.chain}`,"#ff9f1c",L.chain>=3?"멈출 수 없다!":"한 번 더?");
      if(!S.rows[L.tp].some(t=>!t.up))setTimeout(()=>{FX.sfx("boom");FX.flash("#ff5d73");FX.banner("💀 탈락!","#ff5d73",names[L.tp]+"의 코드가 모두 풀렸어요");FX.shake(T,10)},700);
    }else{
      FX.sfx("no");FX.flash("#ff3040");FX.shake(T,9);FX.vib([60,40,60]);
      FX.float(c.x,c.y-30,`✗ ${L.n} 아님`,"#ff5d73");
      FX.burst(c.x,c.y,{n:18,color:["#ff5d73","#600"],speed:5,g:.3,size:4,life:35,shape:"rect"});
      // 2) 벌칙: 내 타일 공개
      if(L.rid!=null){const row=S.rows[L.p],ri=row.findIndex(t=>t.id===L.rid),re=tileAt(L.p,ri);
        if(re){const fg2=getComputedStyle(re).color;
          re.animate([{transform:"none",color:"transparent"},{transform:"rotateY(90deg) scale(1.2)",color:"transparent",offset:.45},{transform:"rotateY(0) scale(1.25)",color:fg2,offset:.7,boxShadow:"0 0 0 4px #ff5d73,0 0 30px #ff5d73"},{transform:"none",color:fg2}],{duration:900,delay:450,fill:"backwards"});
          setTimeout(()=>{const q=FX.center(re);FX.sfx("flip");FX.float(q.x,q.y-30,L.p===me?"내 타일 공개…":"약점 노출!","#ffb3b3");
            if(!row.some(t=>!t.up)){FX.sfx("boom");FX.banner("💀 탈락!","#ff5d73",names[L.p]+"의 코드가 모두 풀렸어요")}},850)}}
    }
  },640);
  if(S.cur===me&&!S.over&&L.t==="no")setTimeout(()=>FX.sfx("turn"),1800);
}
CK.run({
 id:"codebreak",title:"코드 추리",icon:"🔐",color:"#5ab0ff",np:[2,3,4],levels:true,
 tagline:"상대의 숨은 숫자를 추리해서 모두 맞혀 보세요 (2~4명)",
 rules:[
  "검은색·흰색 숫자 타일이 0~11까지 각각 한 장씩 있어요. 각자 타일을 받아 <b>숫자가 작은 순서로 왼쪽→오른쪽</b>에 놓아요. (같은 숫자면 <b>검정이 왼쪽</b>)",
  "타일의 <b>색깔은 모두 보이지만 숫자는 주인만</b> 알아요. 내 차례에 더미에서 타일 한 장을 받아 내 줄에 끼워 넣어요.",
  "상대 타일 하나를 골라 <b>숫자를 추리해서 말해요</b>. 맞으면 그 타일이 공개되고, 계속 맞히거나 그만둘 수 있어요.",
  "<b>틀리면</b> 방금 받은 내 타일이 공개돼요(내 약점 노출!). 그리고 차례가 넘어가요.",
  "그만두면 방금 받은 타일은 숨긴 채로 둘 수 있어요.",
  "내 타일이 모두 공개되면 탈락! <b>마지막까지 숨은 타일이 남은 사람이 승리</b>해요.",
  "힌트: 줄이 숫자순이라 이웃 타일을 보면 범위를 좁힐 수 있어요. 내 타일과 공개된 숫자는 정답에서 제외돼요."],
 init(seed,np){
  const S={rs:seed,np,over:false,win:-1,cur:0,chain:0,drawn:-1,last:null,pool:[],rows:[]};
  S.pool=shuf(S,Array.from({length:24},(_,i)=>i));
  const per=np===4?3:4;
  for(let p=0;p<np;p++){S.rows.push([]);for(let i=0;i<per;i++)insert(S,p,S.pool.pop())}
  startTurn(S,0);return S;
 },
 turn:S=>S.over?-1:S.cur,
 apply(S,a){
  const p=a.p;
  if(a.t==="stop"){S.last={p,t:"stop"};endTurn(S);return}
  const T=S.rows[a.tp][a.ti];
  if(num(T.id)===a.n){
    T.up=true;S.chain++;S.last={p,t:"ok",tp:a.tp,ti:a.ti,n:a.n,chain:S.chain};
    if(checkWin(S))return;
    if(!alive(S,a.tp)&&S.np>2){}
  }else{
    S.last={p,t:"no",tp:a.tp,ti:a.ti,n:a.n};
    let d=S.rows[p].find(t=>t.id===S.drawn&&!t.up);
    if(!d)d=S.rows[p].find(t=>!t.up);
    if(d){d.up=true;S.last.rid=d.id}
    if(checkWin(S))return;
    endTurn(S);
  }
 },
 click(S,me,d,ui){
  if(d.k==="t"){const [tp,ti]=d.v.split(":").map(Number);ui.sel={tp,ti};if(window.FX)FX.sfx("pop");return"ui"}
  if(d.k==="n"&&ui.sel){const a={t:"guess",p:me,tp:ui.sel.tp,ti:ui.sel.ti,n:+d.v};ui.sel=null;return a}
  if(d.k==="stop"){ui.sel=null;return{t:"stop",p:me}}
 },
 ai(S,p,lv){
  if(S.chain>0&&S.lastAi===p+"x"){}
  // 모든 (상대, 위치) 후보 수집
  const opts=[];
  for(let q=0;q<S.np;q++)if(q!==p)S.rows[q].forEach((t,i)=>{if(!t.up){const c=cands(S,p,q,i);if(c.length)opts.push({q,i,c})}});
  if(!opts.length)return{t:"stop",p};
  opts.sort((a,b)=>a.c.length-b.c.length);
  let pick;
  if(lv==="easy"){pick=opts[Math.floor(Math.random()*opts.length)];
    // 쉬움: 범위 힌트를 무시하고 모르는 숫자 중 무작위
    const kn=known(S,p),t=S.rows[pick.q][pick.i];const pool=[];for(let n=0;n<12;n++)if(!kn.has(col(t.id)*12+n))pool.push(n);
    if(S.chain>0&&Math.random()<.6)return{t:"stop",p};
    return{t:"guess",p,tp:pick.q,ti:pick.i,n:pool[Math.floor(Math.random()*pool.length)]??pick.c[0]};}
  const best=opts[0].c.length;
  if(S.chain>0){
    const lim=1;
    if(best>lim||Math.random()<(lv==="hard"?.0:.25))return{t:"stop",p};
  }
  pick=lv==="hard"?opts[0]:(opts[Math.floor(Math.random()*Math.ceil(opts.length/2))]);
  return{t:"guess",p,tp:pick.q,ti:pick.i,n:pick.c[Math.floor(Math.random()*pick.c.length)]};
 },
 render(S,me,ui,names){
  const my=S.cur===me&&!S.over;
  const tile=(t,p,i)=>{
    const c=col(t.id)?"w":"k",mine=p===me;
    if(t.up)return`<div class="tl ${c} up" data-cid="${cid(t.id)}">${num(t.id)}</div>`;
    if(mine)return`<div class="tl ${c} mine h${t.nw?" nw":""}" data-cid="${cid(t.id)}">${num(t.id)}</div>`;
    const tg=my&&alive(S,p);
    return`<div class="tl ${c} h${tg?" tg":""}${ui.sel&&ui.sel.tp===p&&ui.sel.ti===i?" pick":""}" data-cid="${cid(t.id)}" ${tg?`data-k="t" data-v="${p}:${i}"`:""}>?</div>`;
  };
  let h=`<div class="felt" style="justify-content:flex-start;gap:12px">`;
  for(let k=0;k<S.np;k++){const p=(me+k)%S.np;if(p===me)continue;
   h+=`<div class="seat${S.cur===p&&!S.over?" cur":""}" style="max-width:100%">${names[p]}${alive(S,p)?"":" · 탈락 💀"}<small>숨은 타일 ${S.rows[p].filter(t=>!t.up).length}개</small><div class="row" data-p="${p}" style="margin-top:6px">${S.rows[p].map((t,i)=>tile(t,p,i)).join("")}</div></div>`}
  h+=`<small style="opacity:.8">더미 ${S.pool.length}장</small></div>`;
  h+=`<div class="seat${my?" cur":""}" style="align-self:center;max-width:100%">${names[me]} (나)${alive(S,me)?"":" · 탈락 💀"}<small>점선 = 아직 숨은 내 타일 · 노란 테두리 = 공개됨</small><div class="row" data-p="${me}" style="margin-top:6px">${S.rows[me].map((t,i)=>tile(t,me,i)).join("")}</div></div>`;
  if(my&&ui.sel){
    const t=S.rows[ui.sel.tp][ui.sel.ti],kn=known(S,me),c=cands(S,me,ui.sel.tp,ui.sel.ti);
    h+=`<div class="nums ${col(t.id)?"w":"k"}">${Array.from({length:12},(_,n)=>`<button data-k="n" data-v="${n}" ${c.includes(n)?"":"disabled"}>${n}</button>`).join("")}</div>`;
  }
  if(S.chain>0&&!S.over)h+=`<div class="combo">🔥 연속 정답 x${S.chain}</div>`;
  if(my&&S.chain>0)h+=`<div class="row"><button data-k="stop" class="sec">✋ 그만하고 차례 넘기기</button></div>`;
  return h;
 },
 msg(S,me,names){
  if(S.over)return[S.win===me?"🎉 승리!":names[S.win]+" 승리",S.win===me?"good":"bad"];
  const L=S.last;let t="";
  if(L){t=L.t==="ok"?`${names[L.p]}: ${names[L.tp]}의 ${L.n} 정답!`:L.t==="no"?`${names[L.p]}: ${names[L.tp]}의 ${L.n} 오답 → 자기 타일 공개`:`${names[L.p]}: 그만둠`}
  if(S.cur===me)return[(t?t+"\n":"")+(S.chain>0?"정답! 계속 맞히거나 그만두세요":"상대 타일을 골라 숫자를 맞혀 보세요"),"warn"];
  return[(t?t+" · ":"")+names[S.cur]+" 차례",""];
 },
 after(S,a,me,names,T){fxAfter(S,a,me,names,T)},
 end(S,me,names){setTimeout(()=>{if(!window.FX)return;if(S.win===me){FX.sfx("win");FX.confetti();FX.banner("승리!","#5ab0ff","모든 코드를 지켜냈어요")}else{FX.sfx("lose");FX.banner("패배…","#666",names[S.win]+" 승리")}},1300)},
 endDelay:3000,aiDelay:2100,
 result:(S,me,names)=>[S.win===me?"🎉 승리했어요!":"😵 "+names[S.win]+" 승리","마지막까지 숨은 타일이 남은 사람이 이겨요"]
});
</script><script src="../theme.js"></script>
</body></html>
