<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1130">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보드게임즈">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>보드게임즈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;background:radial-gradient(circle at 50% 0%,#33307a 0%,#171436 55%,#0a0820 100%);color:#eef0ff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
header{text-align:center;margin-bottom:26px}
h1{margin:0;font-size:clamp(26px,4.5vw,40px);letter-spacing:1px}
header p{margin:8px 0 0;opacity:.7;font-size:clamp(13px,2vw,16px)}
#grid{width:100%;max-width:980px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,320px));justify-content:center;gap:18px}
a.card{position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 28%,#1b1840),#1b1840 70%);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:22px;padding:20px;min-height:230px;transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 45%,transparent);outline:none}
a.card:active{transform:scale(.98)}
.ico{font-size:56px;line-height:1}
.name{font-size:22px;font-weight:800}
.sub{font-size:12px;opacity:.6;margin-top:-6px}
.desc{font-size:14px;line-height:1.55;opacity:.85;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;background:#ffffff1c;border-radius:999px;padding:4px 10px}
.go{align-self:flex-start;background:var(--c);color:#13102c;font-weight:800;border-radius:12px;padding:10px 18px;font-size:15px}
.soon{opacity:.45;border-style:dashed;pointer-events:none}
footer{margin-top:34px;font-size:12px;opacity:.5;text-align:center;line-height:1.7}
footer a{color:inherit}
</style>
</head>
<body>
<header>
  <h1>🎲 보드게임 모음</h1>
  <p>태블릿을 바닥에 놓고 둘러앉아, 하고 싶은 게임을 골라 보세요</p>
</header>
<div style="text-align:center;margin:0 0 14px"><button id="hubOnline" style="font:inherit;font-weight:800;font-size:17px;padding:14px 22px;border:0;border-radius:14px;background:#4d7cff;color:#fff;cursor:pointer">🌐 온라인 대기실 (여러 게임 돌아가며)</button></div>
<main id="grid"></main>
<footer>
  새 게임은 이 목록에 계속 추가됩니다<br>
  <a href="https://github.com/kjt7942/boardGames">GitHub · kjt7942/boardGames</a>
</footer>
<script src="firebase-config.js"></script>
<script src="net.js"></script>
<script>
// 게임을 추가하려면 이 배열에 항목을 하나 더 넣으면 됩니다.
const GAMES=[
  {path:"magic-labyrinth/",icon:"🧙",name:"마법의 미로",sub:"The Magic Labyrinth",color:"#9d7cff",
   desc:"보이지 않는 벽을 기억해 마법 심볼을 모으세요. 벽에 부딪히면 처음 자리로!",
   tags:["1인 가능 🤖","온라인 🌐","2~4인","기억력","주사위","20분"]},
  {path:"wall-go/",icon:"🧱",name:"벽바둑",sub:"Wall Go · 데블스 플랜",color:"#4dabff",
   desc:"말을 움직이고 벽을 세워 더 넓은 영역을 차지하세요. 쿼리도와 바둑이 만난 전략 게임.",
   tags:["1인 가능 🤖","온라인 🌐","2~3인","전략","영역 싸움","15분"]},
  {path:"janggi/",icon:"♟️",name:"장기",sub:"Janggi · 한국 전통 장기",color:"#2fbf71",
   desc:"초와 한이 겨루는 전통 장기. 차·포·마·상으로 상대 왕을 외통에 몰아넣으세요.",
   tags:["1인 가능 🤖","온라인 🌐","2인","전략","전통","20분"]},
  {path:"baduk/",icon:"⚫",name:"바둑",sub:"Baduk · 9·13·19줄",color:"#ffd24d",
   desc:"돌을 놓아 더 넓은 집을 차지하는 바둑. 9줄로 가볍게, 19줄로 본격적으로 즐겨요.",
   tags:["1인 가능 🤖","온라인 🌐","2인","전략","전통","20분"]},
  {path:"omok/",icon:"⚪",name:"오목",sub:"Omok · 15·19줄",color:"#ff8a5c",
   desc:"가로·세로·대각선으로 먼저 5개를 이으면 승리! 쉽고 빠른 한 판.",
   tags:["1인 가능 🤖","온라인 🌐","2인","전략","10분"]},
  {path:"chess/",icon:"♞",name:"체스",sub:"Chess · 캐슬링·앙파상 지원",color:"#c9a14a",
   desc:"킹을 지키며 상대 킹을 체크메이트로 몰아넣는 세계적인 전략 게임.",
   tags:["1인 가능 🤖","온라인 🌐","2인","전략","20분"]},
  {path:"onecard/",icon:"🃏",name:"원카드",sub:"One Card · 트럼프",color:"#e0453a",
   desc:"같은 무늬·숫자로 손패를 먼저 비우세요. 공격 카드(2·A·조커)와 J·Q·K·7 기술 카드가 있어요.",
   tags:["1인 가능 🤖","온라인 🌐","2~4인","카드","10분"]},
  {path:"thief/",icon:"🦹",name:"도둑잡기",sub:"Old Maid · 트럼프",color:"#8e5cf0",
   desc:"짝을 버리고 상대 카드를 뽑아요. 조커를 끝까지 들고 있으면 도둑!",
   tags:["1인 가능 🤖","온라인 🌐","2~4인","카드","운","5분"]},
  {path:"blackjack/",icon:"♠️",name:"블랙잭",sub:"Blackjack · 8판 승부",color:"#2fbf71",
   desc:"21에 가깝게! 딜러를 이겨 칩을 모으세요. 히트·스탠드·더블.",
   tags:["1인 가능 🤖","온라인 🌐","1~4인","카드","15분"]},
  {path:"minhwatu/",icon:"🎴",name:"민화투",sub:"Minhwatu · 화투",color:"#d8283b",
   desc:"같은 달 화투를 맞춰 먹고 광·열·띠·약 점수로 겨뤄요.",
   tags:["1인 가능 🤖","온라인 🌐","2~3인","화투","10분"]},
  {path:"codebreak/",icon:"🔐",name:"코드 추리",sub:"숨은 숫자 타일 추리",color:"#5ab0ff",
   desc:"상대의 숨은 숫자 타일을 추리로 맞혀 모두 공개시키세요.",
   tags:["1인 가능 🤖","온라인 🌐","2~4인","추리","15분"]},
  {path:"memory/",icon:"🐾",name:"짝 맞추기",sub:"Memory Match",color:"#ff8a5c",
   desc:"같은 그림 두 장을 찾아라! 기억력으로 겨루는 카드 뒤집기.",
   tags:["1인 가능 🤖","온라인 🌐","1~4인","기억력","10분"]},
  {path:"matgo/",icon:"🌸",name:"맞고",sub:"Matgo · 2인 화투",color:"#e0453a",
   desc:"화투 2인 대결! 뻑·따닥·쪽·쓸에 7점이 넘으면 고 또는 스톱.",
   tags:["1인 가능 🤖","온라인 🌐","2인","화투","10분"]},
];
const HUBG=[
 {k:"janggi",icon:"♟️",name:"장기",np:[2]},{k:"baduk",icon:"⚫",name:"바둑",np:[2]},
 {k:"omok",icon:"⚪",name:"오목",np:[2]},{k:"chess",icon:"♞",name:"체스",np:[2]},
 {k:"magic-labyrinth",icon:"🧙",name:"마법의 미로",np:[2,3,4]},{k:"wall-go",icon:"🧱",name:"벽바둑",np:[2,3]},
 {k:"onecard",icon:"🃏",name:"원카드",np:[2,3,4]},{k:"thief",icon:"🦹",name:"도둑잡기",np:[2,3,4]},
 {k:"blackjack",icon:"♠️",name:"블랙잭",np:[2,3,4]},{k:"minhwatu",icon:"🎴",name:"민화투",np:[2,3]},{k:"matgo",icon:"🌸",name:"맞고",np:[2]},
 {k:"codebreak",icon:"🔐",name:"코드 추리",np:[2,3,4]},{k:"memory",icon:"🐾",name:"짝 맞추기",np:[2,3,4]}];
document.getElementById("hubOnline").onclick=()=>BGNet.open({hub:true,game:"*",title:"대기실",games:HUBG,
  sizes:[{np:2,label:"2인"},{np:3,label:"3인"},{np:4,label:"4인"}],onStart(){},onClose(){}});
const grid=document.getElementById("grid");
grid.innerHTML=GAMES.map(g=>`
  <a class="card" href="${g.path}" style="--c:${g.color}">
    <div class="ico">${g.icon}</div>
    <div class="name">${g.name}</div>
    <div class="sub">${g.sub}</div>
    <div class="desc">${g.desc}</div>
    <div class="tags">${g.tags.map(t=>`<span>${t}</span>`).join("")}</div>
    <span class="go">▶ 시작하기</span>
  </a>`).join("");
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
