<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#0b1130">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="../icons/favicon.png"><title>민화투</title></head>
<body>
<style>
/*HW*//*HW*/.hw{width:56px;height:80px;border-radius:8px;background:transparent;position:relative;display:inline-block;box-shadow:0 2px 5px #0007;color:#222}

.hw .m{position:absolute;left:2px;top:2px;font-weight:800;font-size:10px;background:#fffc;border-radius:4px;padding:0 3px}

.hw .t{position:absolute;left:50%;transform:translateX(-50%);bottom:2px;font-size:10px;font-weight:800;padding:0 5px;border-radius:5px;color:#fff;white-space:nowrap}
.hw.G .t{background:#c9a000}
.hw.Y .t{background:#3d8c2f}
.hw.T .t{background:#d8283b}
.hw.T.b{background:#dde8fb}.hw.T.b .t{background:#2f5fd0}
.hw.T.c{background:#e4f5e6}.hw.T.c .t{background:#2a9d4a}
.hw.T.n{background:#f2ece4}.hw.T.n .t{background:#8a6d4d}
.hw.P{background:#ece7de}.hw.P .t{background:#8a8a8a}
@media (min-width:700px){.hw{width:68px;height:97px}}
.hw.ok{outline:3px solid #ffd24d;transform:translateY(-8px);cursor:pointer}
.hw.fl{outline:3px solid #ff7a59}
.hw.s{width:32px;height:46px}.hw.s .m,.hw.s .t{display:none}
.cap{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:300px}
</style>
<script src="../cardart.js"></script><script src="../fx.js"></script><script src="../cardkit.js"></script><script src="../firebase-config.js"></script><script src="../net.js"></script>
<script>
const {rnd,shuf}=CK;
const EM=["🌲","🌺","🌸","🌿","💐","🌷","🍀","🌕","🏵️","🍁","🌳","☔"];
const MN=["송학","매조","벚꽃","흑싸리","난초","모란","홍싸리","공산","국화","단풍","오동","비"];
// 월별 구성 (광G 열Y 띠T 피P)
const COMP=[["G","T","P","P"],["Y","T","P","P"],["G","T","P","P"],["Y","T","P","P"],["Y","T","P","P"],["Y","T","P","P"],["Y","T","P","P"],["G","Y","P","P"],["Y","T","P","P"],["Y","T","P","P"],["G","P","P","P"],["G","Y","T","P"]];
const mo=c=>c>>2,ty=c=>COMP[c>>2][c&3],SS=c=>CA.isSS(c);
const DAN=m=>[0,1,2].includes(m)?"홍":[5,8,9].includes(m)?"청":[3,4,6].includes(m)?"초":"";
const KN={G:"광",Y:"열",T:"띠",P:"피"};
function hw(c,extra,data){
  const t=ty(c),m=mo(c),d=t==="T"?DAN(m):"";
  return `<div class="hw ${t} ${extra||""}" data-cid="${c}" title="${m+1}월 ${t==="P"&&SS(c)?"쌍피":KN[t]}" ${data||""}>${CA.hwatu(c)}</div>`;
}
function score(cards){
  let s=0,det=[];const cnt={G:0,Y:0,T:0,P:0};
  cards.forEach(c=>cnt[ty(c)]++);
  s=cnt.G*20+cnt.Y*10+cnt.T*5;
  const byM={};cards.forEach(c=>byM[mo(c)]=(byM[mo(c)]||0)+1);
  [[4,20],[9,20],[11,20],[10,40]].forEach(([m,v])=>{if(byM[m]===4){s+=v;det.push(MN[m]+"약 +"+v)}});
  [["홍",30],["청",30],["초",30]].forEach(([d,v])=>{if(cards.filter(c=>ty(c)==="T"&&DAN(mo(c))===d).length===3){s+=v;det.push(d+"단 +"+v)}});
  return{s,det,cnt};
}
const val=c=>({G:20,Y:10,T:5,P:0})[ty(c)];
function afterTurn(S,p){
  if(S.hands.every(h=>!h.length)){S.over=true;return}
  S.cur=(p+1)%S.np;
}
function mFlip(S,p){
  if(S.stock.length){
    const f=S.stock.pop();S.pc.f=f;
    const g=S.floor.filter(x=>mo(x)===mo(f));
    if(g.length===2){S.phase="pick";S.pk={stage:"flip",card:f,opts:g};return}
    if(g.length){S.floor=S.floor.filter(x=>mo(x)!==mo(f));S.pc.cap2=[f,...g];S.cap[p].push(...S.pc.cap2)}else S.floor.push(f);
  }
  mFinish(S,p);
}
function mFinish(S,p){S.last={p,c:S.pc.c,cap1:S.pc.cap1,f:S.pc.f,cap2:S.pc.cap2};S.pc=null;afterTurn(S,p)}
// ── 연출 ──
let FXS=null,FXL=null,FXD={};
function fxAfter(S,a,me,names,T){
  if(!window.FX)return;
  if(FXS!==S){FXS=S;FXL=null;FXD={}}
  if(!S.last||S.last===FXL)return;FXL=S.last;
  const L=S.last,p=L.p,caps=[].concat(L.cap||[],L.cap1||[],L.cap2||[]);
  const q=FX.center(T);let delay=500;
  (L.ev||[]).forEach(ev=>{
    const m={"쪽":["쪽!","#5ee08a","ok"],"따닥":["따닥!","#5ee08a","ok"],"쓸":["싹쓸이!","#4dabff","ok"],"뻑":["뻑!","#ff5d73","no"],"뻑 먹기":["뻑 먹기!","#ffd24d","ok"],"고!":["고!","#ff3b3b","check"]}[ev];
    if(!m)return;setTimeout(()=>{FX.sfx(m[2]);FX.banner(m[0],m[1],names[p]);if(m[2]!=="no")FX.burst(q.x,q.y,{n:30,color:[m[1],"#fff"],speed:7,g:.1,size:5,life:45,shape:"star"});else FX.shake(T,6);if(ev==="고!")FX.flash("#ff3b3b")},delay);delay+=900;
  });
  if(caps.some(c=>ty(c)==="G"))setTimeout(()=>{FX.sfx("magic");FX.float(q.x,q.y-40,"✨ 광!","#ffd24d");FX.burst(q.x,q.y,{n:24,color:["#ffd24d","#fff"],speed:6,g:.05,size:5,life:45,shape:"star"})},450);
  if(caps.length>=4)setTimeout(()=>{FX.sfx("capture",{n:caps.length});FX.float(q.x,q.y+40,`${caps.length}장 먹음!`,"#5ee08a")},500);
  // 새 족보
  const det=score(S.cap[p]).det.map(x=>x.replace(/ \d+$/,"").replace(/ \+\d+$/,"")),prev=FXD[p]||[];FXD[p]=det;
  const nw=det.filter(x=>!prev.includes(x)&&!/^(열끗|띠|피)$/.test(x));
  nw.forEach(x=>{setTimeout(()=>{FX.sfx("win");FX.banner(x+"!",p===me?"#ffd24d":"#ff9f1c",names[p]+" 족보 완성");if(p===me)FX.confetti({colors:["#ffd24d","#ff5d73","#fff"]})},delay);delay+=1200});
}
CK.run({
 after(S,a,me,names,T){try{fxAfter(S,a,me,names,T)}catch(e){}},
 id:"minhwatu",title:"민화투",icon:"🎴",color:"#d8283b",np:[2,3],levels:true,
 tagline:"같은 달의 화투를 맞춰 먹고 점수를 겨뤄요 (2~3명)",
 rules:[
  "화투 48장은 12달 × 4장이에요. 2명이면 <b>10장씩</b>, 3명이면 <b>7장씩</b> 나눠 갖고 바닥에 깔려요.",
  "내 차례에 손패 한 장을 내요. 바닥에 <b>같은 달</b>이 1장이면 가져와요(먹기). <b>2장이면 그중 1장을 골라서</b> 먹고, 3장이면 전부 먹어요. 없으면 바닥에 내려놓아요.",
  "이어서 더미에서 한 장을 뒤집어 같은 달이 바닥에 있으면 먹고, 없으면 바닥에 놓여요.",
  "손패가 모두 떨어지면 끝! 먹은 패 점수: <b>광 20 · 열(동물·꽃) 10 · 띠 5 · 피 0</b>",
  "<b>약</b>: 난초(5월)·단풍(10월)·비(12월) 4장 모두 먹으면 +20, 오동(11월) 4장은 +40",
  "<b>단</b>: 홍단(1·2·3월 띠)·청단(6·9·10월 띠)·초단(4·5·7월 띠)을 3장 모으면 각 +30",
  "점수가 가장 높은 사람이 승리! (전통 규칙 요약판이에요)"],
 init(seed,np){
  const S={rs:seed,np,cur:0,over:false,last:null,hands:[],cap:[],floor:[],stock:[],phase:"play",pk:null,pc:null};
  S.stock=shuf(S,Array.from({length:48},(_,i)=>i));
  for(let p=0;p<np;p++){S.hands.push([]);S.cap.push([])}
  const [fl,per]=np===2?[4,5]:[3,4];
  for(let r=0;r<2;r++){for(let i=0;i<fl;i++)S.floor.push(S.stock.pop());for(let p=0;p<np;p++)for(let i=0;i<per;i++)S.hands[p].push(S.stock.pop())}
  return S;
 },
 turn:S=>S.over?-1:S.cur,
 apply(S,a){
  const p=a.p;
  if(a.t==="pick"){
    const pk=S.pk,x=a.v;S.pk=null;S.phase="play";
    S.floor=S.floor.filter(y=>y!==x);
    const cap=[pk.card,x];S.cap[p].push(...cap);
    if(pk.stage==="hand"){S.pc.cap1=cap;mFlip(S,p)}else{S.pc.cap2=cap;mFinish(S,p)}
    return;
  }
  const c=a.c;S.hands[p].splice(S.hands[p].indexOf(c),1);
  S.pc={c,cap1:[],f:-1,cap2:[]};
  const g=S.floor.filter(x=>mo(x)===mo(c));
  if(g.length===2){S.phase="pick";S.pk={stage:"hand",card:c,opts:g};return}
  if(g.length){S.floor=S.floor.filter(x=>mo(x)!==mo(c));S.pc.cap1=[c,...g];S.cap[p].push(...S.pc.cap1)}else S.floor.push(c);
  mFlip(S,p);
 },
 click(S,me,d){
  if(S.phase==="pick")return d.k==="pk"?{t:"pick",p:me,v:+d.v}:null;
  if(d.k==="h"){const c=+d.v;return{t:"play",p:me,c}}
 },
 ai(S,p,lv){
  if(S.phase==="pick"){const o=S.pk.opts;return{t:"pick",p,v:lv==="easy"?o[Math.floor(Math.random()*o.length)]:o.reduce((a,b)=>val(b)>val(a)?b:a)}}
  const h=S.hands[p];
  if(lv==="easy")return{t:"play",p,c:h[Math.floor(Math.random()*h.length)]};
  const mine=S.cap[p];
  const sc=c=>{
    const g=S.floor.filter(x=>mo(x)===mo(c));
    let s=0;
    if(g.length){
      const add=[c,...g];s=add.reduce((a,x)=>a+val(x),0)+4;
      if(lv==="hard")s+=score([...mine,...add]).s-score(mine).s-add.reduce((a,x)=>a+val(x),0);
      if(g.length===3)s+=15;
    }else{
      s=-val(c)*(lv==="hard"?1.4:.6);
      if(lv==="hard"){
        // 바닥에 같은 달이 이미 있으면 상대가 먹기 쉬움, 내가 4장 노리는 달은 가급적 지킴
        const same=h.filter(x=>x!==c&&mo(x)===mo(c)).length;s+=same*2;
        if([4,9,10,11].includes(mo(c)))s-=4;
      }
    }
    return s+Math.random();
  };
  return{t:"play",p,c:h.reduce((a,b)=>sc(b)>sc(a)?b:a)};
 },
 render(S,me,ui,names){
  const capHtml=p=>{const sc=score(S.cap[p]);const order=["G","Y","T","P"];
   return `<div class="cap">${S.cap[p].slice().sort((a,b)=>order.indexOf(ty(a))-order.indexOf(ty(b))||a-b).map(c=>hw(c,"s")).join("")}</div>`};
  let h=`<div class="row" style="align-items:flex-start">`;
  for(let k=1;k<S.np;k++){const p=(me+k)%S.np,sc=score(S.cap[p]);
   h+=`<div class="seat${S.cur===p&&!S.over?" cur":""}">${names[p]} · 손패 ${S.hands[p].length}장<small>점수 ${sc.s}${sc.det.length?" ("+sc.det.join(", ")+")":""}</small>${capHtml(p)}</div>`}
  h+=`</div><div class="felt"><div class="row" style="gap:6px;max-width:560px">${S.floor.map(c=>{const pk=S.phase==="pick"&&S.cur===me&&S.pk.opts.includes(c);return pk?hw(c,"ok",`data-k="pk" data-v="${c}"`):hw(c,S.last&&(S.last.f===c||S.last.c===c)?"fl":"")}).join("")||"<span style='opacity:.6'>바닥이 비었어요</span>"}</div>
   <small style="opacity:.8">더미 ${S.stock.length}장</small></div>`;
  const sc=score(S.cap[me]);
  h+=`<div class="seat${S.cur===me&&!S.over?" cur":""}" style="align-self:center;max-width:100%">${names[me]} · 점수 <b>${sc.s}</b>${sc.det.length?" ("+sc.det.join(", ")+")":""}${capHtml(me)}</div>
   <div class="hand">${S.hands[me].slice().sort((a,b)=>a-b).map(c=>{const ok=S.floor.some(x=>mo(x)===mo(c));return hw(c,S.cur===me&&!S.over?(ok&&S.phase==="play"?"ok":""):"",`data-k="h" data-v="${c}"`)}).join("")}</div>`;
  return h;
 },
 msg(S,me,names){
  if(S.over)return["끝! 점수를 확인해요","good"];
  const L=S.last;let t="";
  if(L){const f=a=>a.length?`먹음 ${a.length}장`:"바닥에 놓음";t=`${names[L.p]}: ${mo(L.c)+1}월 ${f(L.cap1)}, 뒤집기 ${L.f>=0?mo(L.f)+1+"월 "+f(L.cap2):""}`}
  if(S.phase==="pick")return S.cur===me?["같은 달 패가 2장이에요\n먹을 패를 바닥에서 한 장 골라요(노란 테두리)","warn"]:[names[S.cur]+"이(가) 먹을 패를 고르는 중…",""];
  if(S.cur===me)return[(t?t+"\n":"")+"같은 달이 있는 패(노란 테두리)를 내면 먹어요","warn"];
  return[(t?t+" · ":"")+names[S.cur]+" 차례",""];
 },
 result(S,me,names){
  const sc=S.cap.map(score),best=Math.max(...sc.map(x=>x.s));
  const w=sc.map((x,i)=>x.s===best?i:-1).filter(i=>i>=0);
  const won=w.includes(me);
  return[won?(w.length>1?"🤝 공동 1등!":"🎉 승리했어요!"):"😵 "+names[w[0]]+" 승리",
   "<div style='text-align:left'>"+sc.map((x,i)=>`${names[i]}: <b>${x.s}점</b> ${x.det.join(", ")}`).join("<br>")+"</div>"];
 }
});
</script></body></html>
